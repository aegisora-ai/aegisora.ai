name: Automated Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Create Release & Changelog
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Run Release Please
        uses: googleapis/release-please-action@v4
        with:
          release-type: node
          package-name: aegisora
          include-v-in-tag: true
